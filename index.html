<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblia Chuj · San Mateo Ixtatán</title>
<meta name="description" content="La Santa Biblia en chuj de San Mateo Ixtatán. Iglesia Encuentro con Dios.">
<meta name="theme-color" content="#1F1A17">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=new URLSearchParams(location.search).get("tema")||JSON.parse(localStorage.getItem("tema")||"\"auto\"");document.documentElement.dataset.tema=t}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.2 15.2 20.5 20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-size" viewBox="0 0 24 24"><path d="M3.5 19 8.5 6l5 13M5.2 14.5h6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 19l3-7.5 3 7.5M16.1 16.6h3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></g></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 5.5v-.5a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 5v10A1.5 1.5 0 0 0 6 16.5h.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 13v6.5h14V13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<a class="skip" href="#main">Ir al texto</a>

<header class="mast">
  <a class="mast-ref" id="ref" href="#/libros">
    <span id="ref-text">Biblia Chuj</span>
    <svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>
  </a>
  <a class="mast-btn" href="#/buscar" aria-label="Buscar en la Biblia"><svg class="ico" aria-hidden="true"><use href="#i-search"/></svg></a>
  <button class="mast-btn" type="button" popovertarget="ajustes" aria-label="Ajustes de lectura"><svg class="ico" aria-hidden="true"><use href="#i-size"/></svg></button>
</header>

<div id="ajustes" popover class="ajustes">
  <h2>Lectura</h2>
  <div class="fila">
    <span id="lbl-size">Tamaño del texto</span>
    <div class="stepper" role="group" aria-labelledby="lbl-size">
      <button type="button" id="size-down" aria-label="Texto más pequeño">A<small>−</small></button>
      <output id="size-out" aria-live="polite">3 de 5</output>
      <button type="button" id="size-up" aria-label="Texto más grande">A<small>+</small></button>
    </div>
  </div>
  <fieldset class="fila">
    <legend>Apariencia</legend>
    <div class="seg">
      <label><input type="radio" name="tema" value="auto" checked><span>Auto</span></label>
      <label><input type="radio" name="tema" value="light"><span>Claro</span></label>
      <label><input type="radio" name="tema" value="dark"><span>Oscuro</span></label>
    </div>
  </fieldset>
  <div class="fila">
    <label class="sw"><input type="checkbox" id="es-toggle"><span class="sw-box" aria-hidden="true"></span><span>Comparar con español <small>Reina-Valera 1909, solo donde los versículos coinciden</small></span></label>
  </div>
  <div class="fila" id="fila-offline">
    <button type="button" class="btn" id="btn-offline"><svg class="ico" aria-hidden="true"><use href="#i-down"/></svg>Guardar toda la Biblia sin conexión</button>
    <p class="nota" id="offline-estado" aria-live="polite"></p>
  </div>
  <div class="fila" id="fila-instalar" hidden>
    <button type="button" class="btn" id="btn-instalar">Instalar la aplicación</button>
  </div>
  <p class="nota" id="ios-tip" hidden>Para instalarla en iPhone: botón Compartir y luego «Añadir a pantalla de inicio».</p>
  <p class="pie">Iglesia Encuentro con Dios · <a href="https://github.com/encuentrocondios/biblia-chuj-smi" rel="noopener">Código y texto</a> · <span id="version"></span></p>
</div>

<main id="main" tabindex="-1">
  <article id="lectura" class="lectura" lang="cac" hidden></article>
  <section id="libros" class="libros" hidden></section>
  <section id="buscar" class="buscar" hidden></section>
  <p id="estado" class="estado" role="status" aria-live="polite"></p>
</main>

<div id="acciones" class="acciones" role="toolbar" aria-label="Acciones del versículo" hidden>
  <span id="acc-ref"></span>
  <button type="button" id="acc-copiar"><svg class="ico" aria-hidden="true"><use href="#i-copy"/></svg>Copiar</button>
  <button type="button" id="acc-compartir"><svg class="ico" aria-hidden="true"><use href="#i-share"/></svg>Compartir</button>
  <button type="button" id="acc-cerrar" aria-label="Quitar selección"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
</div>

<nav class="rail" id="rail" aria-label="Capítulos">
  <a id="rail-prev" href="#/" aria-label="Capítulo anterior"><svg class="ico" aria-hidden="true"><use href="#i-prev"/></svg><span></span></a>
  <a id="rail-libros" href="#/libros"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg>Libros</a>
  <a id="rail-next" href="#/" aria-label="Capítulo siguiente"><span></span><svg class="ico" aria-hidden="true"><use href="#i-next"/></svg></a>
</nav>

<noscript><p style="padding:2rem">Este visor necesita JavaScript. El texto también está disponible como API JSON en <code>books.json</code>.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
